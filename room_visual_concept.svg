<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title description">
  <title id="title">Four-wall bedroom and study visual concept</title>
  <desc id="description">Warm modern wall elevations for the north feature wall, west window workspace, south bed wall, and east fixed cupboard wall.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#302c27" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#302c27" flood-opacity="0.18"/>
    </filter>
    <pattern id="pegboard" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.7" fill="#8e806f"/>
    </pattern>
    <pattern id="linen" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 2 H8 M2 0 V8" stroke="#bdb4a7" stroke-width="0.45" opacity="0.45"/>
    </pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8bfb0"/>
      <stop offset="1" stop-color="#aba194"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bc7d3f"/>
      <stop offset="0.48" stop-color="#cd9251"/>
      <stop offset="1" stop-color="#aa6f36"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ced2"/>
      <stop offset="1" stop-color="#607b84"/>
    </linearGradient>
    <style>
      .display { font-family: Georgia, 'Times New Roman', serif; fill: #252523; }
      .sans { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; fill: #252523; }
      .panel-title { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; font-size: 18px; font-weight: 700; fill: #746b60; }
      .panel-subtitle { font-family: Georgia, 'Times New Roman', serif; font-size: 30px; fill: #252523; }
      .note { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; font-size: 15px; fill: #6d655c; }
      .dimension { font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; font-size: 13px; fill: #84796c; }
      .wall { fill: #eee9df; }
      .baseboard { fill: #d8d0c3; }
      .floor { fill: url(#floor); }
      .outline { stroke: #4a443e; stroke-width: 2; }
    </style>
  </defs>

  <!-- Board -->
  <rect width="1800" height="1400" fill="#d7d0c4"/>
  <rect x="36" y="36" width="1728" height="1328" rx="6" fill="#f7f4ee"/>

  <!-- Header -->
  <text x="92" y="105" class="sans" font-size="16" font-weight="700" fill="#9d5e42">VISUAL CONCEPT 01</text>
  <text x="92" y="158" class="display" font-size="48">A calm room for work and rest</text>
  <text x="94" y="194" class="sans" font-size="18" fill="#6d655c">Warm modern | existing furniture retained | reversible wall additions</text>

  <!-- Palette -->
  <g transform="translate(1310 91)">
    <text x="0" y="0" class="sans" font-size="14" font-weight="700" fill="#746b60">ROOM PALETTE</text>
    <circle cx="14" cy="40" r="14" fill="#eee9df" stroke="#d3cabd"/>
    <circle cx="52" cy="40" r="14" fill="#263a4a"/>
    <circle cx="90" cy="40" r="14" fill="#9d5e42"/>
    <circle cx="128" cy="40" r="14" fill="#77806a"/>
    <circle cx="166" cy="40" r="14" fill="#c68a49"/>
    <text x="0" y="78" class="note">ivory · navy · rust · olive · oak</text>
  </g>

  <!-- NORTH PANEL -->
  <g transform="translate(92 245)">
    <rect width="770" height="500" rx="4" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="42" class="panel-title">NORTH WALL</text>
    <text x="30" y="78" class="panel-subtitle">The restful focal view</text>

    <!-- Elevation shell -->
    <g transform="translate(30 106)">
      <rect width="710" height="310" class="wall"/>
      <rect y="280" width="710" height="12" class="baseboard"/>
      <rect y="292" width="710" height="18" class="floor"/>

      <!-- picture light -->
      <rect x="276" y="42" width="158" height="8" rx="4" fill="#2e2c29"/>
      <rect x="287" y="50" width="136" height="3" fill="#e8c986" opacity="0.9"/>
      <path d="M300 53 L266 108 L444 108 L410 53 Z" fill="#f3dca7" opacity="0.18"/>

      <!-- triptych -->
      <g filter="url(#smallShadow)">
        <rect x="211" y="78" width="88" height="132" fill="#292b2b"/>
        <rect x="217" y="84" width="76" height="120" fill="#f8f4eb"/>
        <path d="M225 183 C239 142 252 159 264 117 C270 98 282 102 287 93 V198 H225 Z" fill="#263a4a"/>
        <circle cx="242" cy="112" r="16" fill="#c68a49"/>

        <rect x="311" y="78" width="88" height="132" fill="#292b2b"/>
        <rect x="317" y="84" width="76" height="120" fill="#f8f4eb"/>
        <path d="M326 196 C334 154 351 162 354 120 C357 96 376 106 384 88 V198 H326 Z" fill="#9d5e42"/>
        <circle cx="345" cy="114" r="15" fill="#77806a"/>

        <rect x="411" y="78" width="88" height="132" fill="#292b2b"/>
        <rect x="417" y="84" width="76" height="120" fill="#f8f4eb"/>
        <path d="M425 194 C437 148 450 167 458 126 C462 102 479 104 487 93 V198 H425 Z" fill="#77806a"/>
        <circle cx="446" cy="111" r="16" fill="#9d5e42"/>
      </g>

      <!-- plant at safe shallow edge -->
      <g transform="translate(614 214)">
        <path d="M26 44 C7 20 5 7 20 1 C33 18 34 30 26 44 Z" fill="#69745e"/>
        <path d="M31 45 C43 15 57 8 64 19 C59 35 47 43 31 45 Z" fill="#78836d"/>
        <path d="M28 47 C19 25 27 13 36 5 C46 20 41 35 28 47 Z" fill="#596553"/>
        <path d="M11 47 H51 L45 68 H17 Z" fill="#9d5e42"/>
      </g>
    </g>

    <g transform="translate(30 446)">
      <circle cx="7" cy="-5" r="4" fill="#9d5e42"/>
      <text x="20" y="0" class="note">Art aligns with the bed, not the wall centre</text>
      <circle cx="378" cy="-5" r="4" fill="#9d5e42"/>
      <text x="391" y="0" class="note">Lower wall stays open for circulation</text>
    </g>
  </g>

  <!-- WEST PANEL -->
  <g transform="translate(938 245)">
    <rect width="770" height="500" rx="4" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="42" class="panel-title">WEST WALL</text>
    <text x="30" y="78" class="panel-subtitle">Window-facing work zone</text>

    <g transform="translate(30 106)">
      <rect width="710" height="310" class="wall"/>
      <rect y="280" width="710" height="12" class="baseboard"/>
      <rect y="292" width="710" height="18" class="floor"/>

      <!-- productivity boards -->
      <rect x="44" y="67" width="118" height="145" rx="2" fill="#fbfaf6" stroke="#b5ada1" stroke-width="4" filter="url(#smallShadow)"/>
      <line x1="59" y1="99" x2="142" y2="99" stroke="#9d5e42" stroke-width="4"/>
      <line x1="59" y1="124" x2="127" y2="124" stroke="#77806a" stroke-width="4"/>
      <line x1="59" y1="149" x2="137" y2="149" stroke="#263a4a" stroke-width="4"/>
      <line x1="59" y1="174" x2="115" y2="174" stroke="#c68a49" stroke-width="4"/>

      <!-- window -->
      <rect x="213" y="34" width="284" height="190" fill="#3d4749" stroke="#f6f2e9" stroke-width="8"/>
      <rect x="225" y="46" width="260" height="166" fill="url(#glass)"/>
      <line x1="355" y1="46" x2="355" y2="212" stroke="#e8e2d8" stroke-width="5"/>
      <path d="M225 159 C282 137 324 156 355 140 C409 113 445 143 485 119 V212 H225 Z" fill="#91a39c" opacity="0.5"/>
      <rect x="229" y="48" width="252" height="58" fill="#e6dfd2"/>
      <rect x="229" y="48" width="252" height="58" fill="url(#linen)"/>
      <rect x="224" y="44" width="262" height="6" fill="#403d38"/>

      <!-- matching curtain panels -->
      <path d="M188 36 H242 V235 H194 C203 188 187 143 199 99 C204 78 194 58 188 36 Z" fill="#263a4a"/>
      <path d="M468 36 H522 C516 61 507 82 513 108 C525 159 505 194 516 235 H470 Z" fill="#263a4a"/>
      <path d="M202 40 V232 M218 40 V232 M484 40 V232 M501 40 V232" stroke="#415464" stroke-width="3" opacity="0.6"/>

      <!-- pegboard -->
      <rect x="550" y="67" width="118" height="145" rx="2" fill="#d7cab7" filter="url(#smallShadow)"/>
      <rect x="550" y="67" width="118" height="145" rx="2" fill="url(#pegboard)"/>
      <rect x="569" y="97" width="78" height="5" rx="2" fill="#3f3b37"/>
      <path d="M578 102 V129 H638 V102" fill="none" stroke="#3f3b37" stroke-width="3"/>
      <rect x="575" y="151" width="66" height="8" fill="#9d5e42"/>
      <circle cx="589" cy="139" r="10" fill="#77806a"/>

      <!-- fixed desk -->
      <rect x="176" y="225" width="358" height="19" rx="2" fill="#efede6" stroke="#c4beb3"/>
      <rect x="190" y="244" width="91" height="58" fill="#272827"/>
      <line x1="205" y1="263" x2="266" y2="263" stroke="#6c6e69" stroke-width="2"/>
      <line x1="205" y1="282" x2="266" y2="282" stroke="#6c6e69" stroke-width="2"/>
      <rect x="507" y="244" width="10" height="58" fill="#30312f"/>
      <rect x="334" y="182" width="84" height="50" rx="3" fill="#262827"/>
      <rect x="340" y="188" width="72" height="38" fill="#b7c1bb"/>
      <rect x="373" y="232" width="7" height="12" fill="#3b3b39"/>

      <!-- chair -->
      <g transform="translate(313 246)">
        <ellipse cx="42" cy="57" rx="50" ry="8" fill="#5d574f" opacity="0.18"/>
        <path d="M8 0 Q42 -22 76 0 V42 Q42 54 8 42 Z" fill="#282a29"/>
        <path d="M21 6 Q42 -4 63 6 V30 Q42 39 21 30 Z" fill="#3b3e3c"/>
        <line x1="42" y1="42" x2="42" y2="57" stroke="#2a2c2b" stroke-width="6"/>
        <path d="M42 56 L15 64 M42 56 L69 64" stroke="#2a2c2b" stroke-width="5"/>
      </g>
    </g>

    <g transform="translate(30 446)">
      <circle cx="7" cy="-5" r="4" fill="#263a4a"/>
      <text x="20" y="0" class="note">Fixed desk and chair face the window</text>
      <circle cx="363" cy="-5" r="4" fill="#263a4a"/>
      <text x="376" y="0" class="note">Whiteboard + pegboard frame the work view</text>
    </g>
  </g>

  <!-- SOUTH PANEL -->
  <g transform="translate(92 785)">
    <rect width="770" height="485" rx="4" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="42" class="panel-title">SOUTH WALL</text>
    <text x="30" y="78" class="panel-subtitle">A quiet, compact bed wall</text>

    <g transform="translate(30 106)">
      <rect width="710" height="300" class="wall"/>
      <rect y="270" width="710" height="12" class="baseboard"/>
      <rect y="282" width="710" height="18" class="floor"/>

      <!-- retained high fitting -->
      <rect x="249" y="30" width="212" height="8" rx="4" fill="#f7f6f1" stroke="#cbc8c0"/>
      <circle cx="265" cy="34" r="2" fill="#afaba3"/>
      <circle cx="445" cy="34" r="2" fill="#afaba3"/>

      <!-- headboard -->
      <rect x="176" y="116" width="358" height="111" rx="8" fill="#a65f47" filter="url(#smallShadow)"/>
      <path d="M265 116 V227 M355 116 V227 M445 116 V227" stroke="#c07a61" stroke-width="2"/>
      <path d="M176 172 H534" stroke="#c07a61" stroke-width="2"/>

      <!-- compact reading sconces -->
      <g fill="#2d2e2c">
        <circle cx="200" cy="91" r="8"/>
        <path d="M200 91 L211 111" stroke="#2d2e2c" stroke-width="5"/>
        <path d="M204 109 H222 L216 125 H210 Z"/>
        <circle cx="510" cy="91" r="8"/>
        <path d="M510 91 L499 111" stroke="#2d2e2c" stroke-width="5"/>
        <path d="M506 109 H488 L494 125 H500 Z"/>
      </g>

      <!-- bed -->
      <path d="M156 218 Q355 199 554 218 V282 H156 Z" fill="#f5f0e8" filter="url(#smallShadow)"/>
      <path d="M156 239 Q355 221 554 239 V282 H156 Z" fill="#263a4a"/>
      <path d="M321 234 Q410 224 487 235 V282 H321 Z" fill="#77806a"/>
      <path d="M233 208 Q274 198 316 209 V239 Q273 230 233 239 Z" fill="#fbf8f0"/>
      <path d="M326 208 Q367 198 409 209 V237 Q367 228 326 237 Z" fill="#fbf8f0"/>
      <rect x="146" y="278" width="418" height="8" rx="4" fill="#313230"/>
    </g>

    <g transform="translate(30 440)">
      <circle cx="7" cy="-5" r="4" fill="#9d5e42"/>
      <text x="20" y="0" class="note">No bedside furniture competing with the door or desk</text>
    </g>
  </g>

  <!-- EAST PANEL -->
  <g transform="translate(938 785)">
    <rect width="770" height="485" rx="4" fill="#ffffff" filter="url(#shadow)"/>
    <text x="30" y="42" class="panel-title">EAST WALL</text>
    <text x="30" y="78" class="panel-subtitle">Fixed storage, visually quieter</text>

    <g transform="translate(30 106)">
      <rect width="710" height="300" class="wall"/>
      <rect y="270" width="710" height="12" class="baseboard"/>
      <rect y="282" width="710" height="18" class="floor"/>

      <!-- fixed cupboards -->
      <rect x="0" y="14" width="485" height="256" fill="url(#wood)"/>
      <rect x="0" y="14" width="485" height="62" fill="#c78a4a"/>
      <path d="M97 14 V76 M194 14 V76 M291 14 V76 M388 14 V76" stroke="#9b6533" stroke-width="2"/>
      <path d="M242 76 V270 M363 76 V270" stroke="#965f31" stroke-width="2"/>
      <g stroke="#5e4735" stroke-width="4" stroke-linecap="round">
        <path d="M90 43 V52 M187 43 V52 M284 43 V52 M381 43 V52"/>
        <path d="M232 154 V171 M252 154 V171 M353 154 V171 M373 154 V171"/>
      </g>

      <!-- existing mirror -->
      <rect x="268" y="101" width="68" height="118" fill="#e5ece9" stroke="#9d6b3b" stroke-width="5"/>
      <path d="M276 109 L328 211" stroke="#ffffff" stroke-width="4" opacity="0.45"/>

      <!-- entry door -->
      <rect x="510" y="77" width="175" height="193" fill="#e7e1d7" stroke="#b8aea0" stroke-width="5"/>
      <rect x="522" y="89" width="151" height="169" fill="#eee9df" stroke="#d1c8bb" stroke-width="2"/>
      <circle cx="648" cy="180" r="7" fill="#a77d4d"/>

      <!-- restrained entry light -->
      <rect x="515" y="54" width="165" height="7" rx="3" fill="#3a3834"/>
      <path d="M526 61 H669 L652 78 H543 Z" fill="#efcb83" opacity="0.24"/>

      <!-- clear swing arc -->
      <path d="M683 270 A173 173 0 0 0 510 97" fill="none" stroke="#9d5e42" stroke-width="2" stroke-dasharray="7 6" opacity="0.8"/>
    </g>

    <g transform="translate(30 440)">
      <circle cx="7" cy="-5" r="4" fill="#c68a49"/>
      <text x="20" y="0" class="note">Cupboard remains unchanged</text>
      <circle cx="287" cy="-5" r="4" fill="#9d5e42"/>
      <text x="300" y="0" class="note">Door and swing path stay completely clear</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="92" y1="1317" x2="1708" y2="1317" stroke="#d5cec3"/>
  <text x="92" y="1344" class="dimension">CONCEPT ELEVATIONS · based on the supplied room photographs · fixed table, chair and cupboard retained</text>
  <text x="1708" y="1344" class="dimension" text-anchor="end">28 AUG 2026</text>
</svg>